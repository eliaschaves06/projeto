<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Maker - Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>Lab Maker</header>
<div class="container">
    <!-- Tela Inicial -->
    <div id="home" class="screen active">
        <button onclick="showScreen('agendamento')">Agendamento Lab Maker</button>
        <button onclick="showScreen('solicitacoes')">Solicitações</button>
    </div>

    <!-- Tela Agendamento -->
    <div id="agendamento" class="screen">
        <h2>Calendário de Agendamentos</h2>
        <table id="calendar">
            <thead>
                <tr>
                    <th>Dom</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sáb</th>
                </tr>
            </thead>
            <tbody id="calendar-body"></tbody>
        </table>

        <form id="agendamento-form">
            <h3>Cadastro Rápido</h3>
            <input type="text" placeholder="Nome" required>
            <input type="tel" placeholder="Telefone" required>
            <input type="number" placeholder="Quantidade de pessoas" required>
            <button type="submit">Solicitar Agendamento</button>
        </form>
        <button onclick="showScreen('home')">Voltar</button>
    </div>

    <!-- Tela Solicitações -->
    <div id="solicitacoes" class="screen">
        <h2>Solicitações</h2>
        <div class="kanban">
            <div class="kanban-column">
                <h3>Recebido</h3>
                <div class="kanban-card recebido">Solicitação 1</div>
            </div>
            <div class="kanban-column">
                <h3>Análise</h3>
                <div class="kanban-card analise">Solicitação 2</div>
            </div>
            <div class="kanban-column">
                <h3>Fazendo</h3>
                <div class="kanban-card fazendo">Solicitação 3</div>
            </div>
            <div class="kanban-column">
                <h3>Concluído</h3>
                <div class="kanban-card concluido">Solicitação 4</div>
            </div>
        </div>

        <form id="solicitacao-form">
            <h3>Criar Nova Solicitação</h3>
            <input type="text" placeholder="Nome" required>
            <input type="tel" placeholder="Telefone" required>
            <textarea placeholder="Descrição da solicitação" required></textarea>
            <textarea placeholder="Especificações técnicas (opcional)"></textarea>
            <input type="file">
            <button type="submit">Enviar Solicitação</button>
        </form>
        <button onclick="showScreen('home')">Voltar</button>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
